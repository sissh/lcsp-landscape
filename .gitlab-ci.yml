include:
  - component: gitlab.lcsp.intra/infra/runner-manager/provision@1.2.0
    inputs:
      executor: shell
      install_docker: "false"
      provisioner_image: registry.lcsp.intra/infra/runner-manager/provisioner:1.2.0
      ct_bridge: vmbr2
      ct_cpu: "1"
      ct_ram: "2048"
      ct_disk: "10"
      ct_storage: ceph-vm-infra
      ct_ip: "192.168.20.104/24"
      ct_gw: "192.168.20.1"
      # Apache est installé PAR LE PROVISIONNEMENT, pas par un job : les jobs
      # tournent sous "gitlab-runner", qui n'a pas sudo — un apt-get y échoue sur
      # le verrou dpkg. Même raison pour la racine web, que deploy-prod doit
      # pouvoir écrire.
      ct_packages: "apache2"
      ct_owned_paths: "/var/www/html"

stages:
  - provision
  - configure-zabbix
  - build-job
  - deploy-prod

.landscape-runner:
  needs: ["provision-runner"]
  # Ces deux tags sont les seuls garantis par runner-manager, qui enregistre le
  # runner avec "<CI_PROJECT_PATH_SLUG>,proxmox,deploy" — ici
  tags:
    - proxmox
    - deploy
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_BRANCH == "main"


configure-zabbix-agent:
  stage: configure-zabbix

  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"'

  allow_failure: false

  script:
    - |
      set -euo pipefail

      : "${ZABBIX_SERVER:?Variable ZABBIX_SERVER manquante}"
      : "${ZABBIX_METADATA:?Variable ZABBIX_METADATA manquante}"
      true

      echo "Vérification de Zabbix Agent 2 sur $(hostname)"

      workdir="$(mktemp -d)"
      trap 'rm -rf "$workdir"' EXIT

      # 1. Vérification de l'installation
      if ! dpkg-query -W -f='${Status}' zabbix-agent2 2>/dev/null \
          | grep -qx 'install ok installed'; then

        . /etc/os-release
        if [ "$ID" != "debian" ] || [ "$VERSION_ID" != "12" ]; then
          echo "Installation automatique prévue pour Debian 12 uniquement" >&2
          exit 1
        fi

        echo "Installation de Zabbix Agent 2"

        wget -qO "$workdir/zabbix-release.deb" \
          'https://repo.zabbix.com/zabbix/7.4/release/debian/pool/main/z/zabbix-release/zabbix-release_latest_7.4+debian12_all.deb'

        dpkg -i "$workdir/zabbix-release.deb"
        apt-get update
        env DEBIAN_FRONTEND=noninteractive \
          apt-get install -y zabbix-agent2
      else
        echo "Paquet zabbix-agent2 déjà installé"
      fi

      # 2. Préparation de la configuration
      mkdir -p /etc/zabbix/zabbix_agent2.d/plugins.d

      cat > "$workdir/zabbix_agent2.conf" <<EOF
      PidFile=/run/zabbix/zabbix_agent2.pid
      LogFile=/var/log/zabbix/zabbix_agent2.log
      LogFileSize=0

      Server=${ZABBIX_SERVER}
      ServerActive=${ZABBIX_SERVER}

      ListenPort=10050
      HostnameItem=system.hostname
      HostMetadata=${ZABBIX_METADATA}
      ForceActiveChecksOnStart=1

      PluginSocket=/run/zabbix/agent.plugin.sock
      ControlSocket=/run/zabbix/agent.sock

      Include=/etc/zabbix/zabbix_agent2.d/plugins.d/*.conf
      Include=/etc/zabbix/zabbix_agent2.d/*.conf
      EOF

      # 3. Validation avant application
      echo "Validation de la configuration"
      /usr/sbin/zabbix_agent2 -T \
        -c "$workdir/zabbix_agent2.conf"

      # 4. Application uniquement en cas de modification
      if cmp -s \
          "$workdir/zabbix_agent2.conf" \
          /etc/zabbix/zabbix_agent2.conf; then

        echo "Configuration inchangée"
        systemctl enable --now zabbix-agent2
      else
        echo "Application de la configuration"

        install -o root -g zabbix -m 0640 \
          "$workdir/zabbix_agent2.conf" \
          /etc/zabbix/zabbix_agent2.conf

        systemctl enable zabbix-agent2
        systemctl restart zabbix-agent2
      fi

      # 5. Vérifications finales
      echo "Vérification du service"
      systemctl is-active --quiet zabbix-agent2

      echo "Test de collecte locale"
      /usr/sbin/zabbix_agent2 \
        -t system.hostname \
        -c /etc/zabbix/zabbix_agent2.conf

      echo "Zabbix Agent 2 est installé et actif sur $(hostname)"


build-job:
  extends: .landscape-runner
  stage: build-job
  script:
    - curl --proto '=https' --tlsv1.2 -LsSf https://github.com/cncf/landscape2/releases/download/v1.1.0/landscape2-installer.sh | sh
    - source $HOME/.cargo/env
    - landscape2 build --data-file $CI_PROJECT_DIR/landscape.yml --settings-file $CI_PROJECT_DIR/settings.yml --logos-path $CI_PROJECT_DIR/hosted_logos --output-dir $CI_PROJECT_DIR/output_landscape
  # Le site passe par les artifacts plutôt que par un chemin partagé sous $HOME :
  # deploy-prod ne dépend donc pas du répertoire de travail laissé par build-job.
  artifacts:
    paths:
      - output_landscape/
    expire_in: 1 day

deploy-prod:
  extends: .landscape-runner
  needs: ["provision-runner", "build-job"]
  stage: deploy-prod
  script:
    - cp -fr output_landscape/. /var/www/html/
  environment: production
